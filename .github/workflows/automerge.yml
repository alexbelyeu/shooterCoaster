name: Auto-merge approved PRs

# The merge gate for the autonomous studio. Agents never merge, and no agent can
# approve its own PR: a separate QA run adds the
# `agent:qa-approved` label, and this workflow squash-merges the PR once the
# `verify` check is green on its current head commit. The logic lives in
# scripts/automerge.cjs (unit tests: automerge.test.ts; local dry run of the sweep:
# node scripts/automerge.cjs --dry-run).
#
# When it runs: on PR label / reopen / ready events, after every successful CI run,
# and as a sweep of every open approved PR every 10 minutes (plus on demand from the
# Actions tab, optionally as a dry run), so a missed or stale event can't strand an
# approved PR. GITHUB_TOKEN writes don't trigger workflows, so it can't loop.
#
# Safety:
# - Only same-repo PRs from `agent/*` branches into `main`, not drafts.
# - A new commit pushed after approval removes the label, so the new code
#   needs a fresh QA approval.
# - Turn the whole thing off by disabling this workflow in the Actions tab.

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be merged or commented on
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write # dispatch ci.yml on main after a merge

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  revoke-on-push:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            if (!pr.labels.some((l) => l.name === 'agent:qa-approved')) return
            await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: 'agent:qa-approved' })
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: ['agent:needs-qa'] })
            await github.rest.issues.createComment({
              ...context.repo, issue_number: pr.number,
              body: 'New commits after QA approval — approval removed, back to `agent:needs-qa`.',
            })

  merge:
    if: >
      (github.event_name == 'pull_request' && github.event.action != 'synchronize') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The script at the commit this workflow definition came from: main's head for
      # CI / schedule / dispatch runs, the PR's merge commit for pull_request runs
      # (which already take their workflow definition from the PR).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/automerge.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/automerge.cjs`)
            await run({ github, context, core })
