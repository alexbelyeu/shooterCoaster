name: Auto-merge approved PRs

# The merge gate for the autonomous studio. Agents never merge; QA (or the
# Director/Maintainer/Reporter for their own docs-only or revert PRs) adds the
# `agent:qa-approved` label, and this workflow squash-merges the PR once the
# `verify` check is green on its current head commit.
#
# Safety:
# - Only same-repo PRs from `agent/*` branches into `main`, not drafts.
# - A new commit pushed after approval removes the label, so the new code
#   needs a fresh QA approval.
# - Turn the whole thing off by disabling this workflow in the Actions tab.

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  revoke-on-push:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            if (!pr.labels.some((l) => l.name === 'agent:qa-approved')) return
            await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: 'agent:qa-approved' })
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: ['agent:needs-qa'] })
            await github.rest.issues.createComment({
              ...context.repo, issue_number: pr.number,
              body: 'New commits after QA approval — approval removed, back to `agent:needs-qa`.',
            })

  merge:
    if: >
      (github.event_name == 'pull_request' && github.event.action != 'synchronize') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo

            // Collect candidate PR numbers for this event.
            let numbers = []
            if (context.eventName === 'pull_request') {
              numbers = [context.payload.pull_request.number]
            } else {
              const sha = context.payload.workflow_run.head_sha
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha })
              numbers = data.filter((p) => p.state === 'open').map((p) => p.number)
            }

            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number })
              const why = (msg) => core.info(`#${number}: skip — ${msg}`)
              if (pr.state !== 'open') { why('not open'); continue }
              if (pr.draft) { why('draft'); continue }
              if (pr.base.ref !== 'main') { why('base is not main'); continue }
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) { why('fork'); continue }
              if (!pr.head.ref.startsWith('agent/')) { why('not an agent/* branch'); continue }
              if (!pr.labels.some((l) => l.name === 'agent:qa-approved')) { why('not approved'); continue }

              const { data: checks } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, check_name: 'verify' })
              const verify = checks.check_runs.sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0]
              if (!verify || verify.status !== 'completed') { why('verify not finished'); continue }
              if (verify.conclusion !== 'success') { why(`verify ${verify.conclusion}`); continue }

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: number, sha: pr.head.sha, merge_method: 'squash',
                  commit_title: `${pr.title} (#${number})`,
                })
                core.info(`#${number}: merged`)
              } catch (e) {
                core.warning(`#${number}: merge failed — ${e.message}`)
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `Auto-merge failed: ${e.message}\nThe branch probably needs a rebase onto main.`,
                })
              }
            }
