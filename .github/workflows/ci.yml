name: CI
# Auto-merges push to main with GITHUB_TOKEN, which never triggers `push`, so
# automerge.yml dispatches this workflow on main after each merge (`merged` names the PR).
run-name: ${{ inputs.merged && format('verify main after {0}', inputs.merged) || github.event.pull_request.title || format('{0} on {1}', github.event_name, github.ref_name) }}

on:
  pull_request:
  push:
    branches: [main]
  # Nightly on main: the whole gate plus portal, which merges to main don't run (#371).
  schedule:
    - cron: '17 7 * * *' # 03:17 New York (EDT)
  workflow_dispatch:
    inputs:
      merged:
        description: 'Merge that prompted this run, e.g. "#123 (abc1234)"'
        required: false
        default: ''

concurrency:
  # The nightly run has its own group: it never cancels, or is cancelled by, the run of a merge.
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

jobs:
  # The required check `verify` (main's ruleset, automerge.cjs, studio-status.cjs) is the gate job at the end (#353).
  # This job decides which jobs the run needs (scripts/ciPlan.cjs, #371): a docs-only PR (studioHealthRules.cjs
  # `isDocsOnly`) skips the game jobs, `unit` too unless it touched scripts/, and `portal` runs only on a PR
  # touching its inputs, nightly, or a hand-started run.
  changes:
    name: changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      game: ${{ steps.plan.outputs.game }}
      unit: ${{ steps.plan.outputs.unit }}
      portal: ${{ steps.plan.outputs.portal }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const { ciPlan } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ciPlan.cjs`)
            const pr = context.payload.pull_request
            // A renamed file counts at both paths: moving code into docs/ still changes the game.
            const files = pr
              ? (await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 }))
                  .flatMap((f) => [f.filename, f.previous_filename].filter(Boolean))
              : []
            const plan = ciPlan({ event: context.eventName, files, merged: context.payload.inputs?.merged || '' })
            core.info(`${files.length} changed files → ${JSON.stringify(plan)}`)
            for (const [job, run] of Object.entries(plan)) core.setOutput(job, String(run))

  unit:
    name: unit + build
    needs: changes
    if: ${{ needs.changes.outputs.unit == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Typecheck + build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

  lighthouse:
    name: lighthouse
    needs: changes
    if: ${{ needs.changes.outputs.game == 'true' }}
    permissions:
      contents: read
    # Pinned: `playwright install --with-deps` started failing on ubuntu-latest on 2 Nov 2026 (likely its move to Ubuntu 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lighthouse (SEO 100, Accessibility + Best Practices ≥ 95)
        run: npm run lighthouse

      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: e2e-results/lighthouse.json
          retention-days: 14

  # Each shard builds the commit itself (~30 s), quicker than waiting on a shared build job; its
  # smokeSeconds watchdog (twice the budget) stops it inside timeout-minutes.
  smoke:
    name: smoke (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.game == 'true' }}
    permissions:
      contents: read
    # Pinned: `playwright install --with-deps` started failing on ubuntu-latest on 2 Nov 2026 (likely its move to Ubuntu 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Exactly the keys of SHARDS in e2e/shards.mjs (e2e/shards.test.ts checks this line).
        shard: [ui, level1, level1-steps, level2, level3, level4, level5, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke shard ${{ matrix.shard }}
        run: node e2e/smoke.mjs --shard ${{ matrix.shard }} --seconds 10

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e-results/
          retention-days: 14

  verify:
    name: verify
    needs: [changes, unit, lighthouse, smoke]
    # Not always(): a run superseded by a newer push skips this instead of reporting red. It runs when the jobs
    # it needs were skipped too: a skipped required check never reports, so a docs-only PR gets its green here.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write # report a red main below
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Skipped passes only where `changes` planned it; if `changes` failed, everything it gates counts as red.
      - name: Unit tests, Lighthouse and every smoke shard passed (or the plan skipped them)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '
            (.changes.outputs // {}) as $plan
            | {unit: $plan.unit, lighthouse: $plan.game, smoke: $plan.game} as $planned
            | [to_entries[] | select(.value.result != "success" and (.value.result != "skipped" or $planned[.key] != "false"))
               | "\(.key) \(.value.result)"] | join(", ")')
          if [ -n "$bad" ]; then echo "::error title=verify::not green: $bad"; exit 1; fi

      # A red main gets an agent:prod-broken issue like a failing production check, so the
      # Maintainer's revert-first rule applies. One open red-main issue at a time: later
      # failures comment on it. The production suites' issues (marked `prod-smoke:<suite>`,
      # scripts/prod-alert.cjs) are left alone: they close themselves when prod is green.
      # Superseded runs end `cancelled` and are not reported.
      - name: Report a red main
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const after = context.payload.inputs?.merged ? `, after ${context.payload.inputs.merged}` : ''
            const body = `CI \`verify\` failed on main @ ${context.sha} (${context.eventName}${after}).\nRun: ${run}\nArtifacts: screenshots and results.json per smoke shard (\`e2e-results-<shard>\`), and \`lighthouse\`.`
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'agent:prod-broken',
            })
            const redMain = open.data.find((i) => !/<!-- prod-smoke:\w+ -->/.test(i.body || ''))
            if (redMain) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: redMain.number, body })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `CI verify failed on main @ ${context.sha.slice(0, 7)}`,
                body,
                labels: ['agent:prod-broken', 'P1', 'type:bug'],
              })
            }

  # The itch.io / Newgrounds / CrazyGames zip (#88): relative paths, no other origin,
  # level 1 played from a sub-path. A job of its own, beside verify: its smoke takes ~5 min.
  # Only where it can break (scripts/ciPlan.cjs): a PR touching its inputs, nightly on main, a hand-started run.
  portal:
    name: portal
    needs: changes
    if: ${{ needs.changes.outputs.portal == 'true' }}
    permissions:
      contents: read
    # Pinned: `playwright install --with-deps` started failing on ubuntu-latest on 2 Nov 2026 (likely its move to Ubuntu 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build + check + zip the portal build
        run: npm run build:portal

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke level 1 under /nested/path/
        run: npm run smoke:portal -- --out e2e-results-portal

      # Only a zip that booted under /nested/path/ is kept: these steps skip when the smoke fails.
      - name: Describe the portal zip
        run: |
          {
            echo "### dist-portal.zip"
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Built | $(date -u +%Y-%m-%dT%H:%MZ) |"
            echo "| Zip size | $(stat -c %s dist-portal.zip | numfmt --to=si --suffix=B) |"
            echo "| Files | $(zipinfo -1 dist-portal.zip | grep -vc '/$') |"
            echo
            echo "Download: this run's Artifacts → \`dist-portal\` (it unzips to \`dist-portal.zip\`, the file to upload to a portal)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the portal zip
        uses: actions/upload-artifact@v4
        with:
          name: dist-portal
          path: dist-portal.zip
          retention-days: 30
          if-no-files-found: error
          # Already a zip: storing it again would only cost time.
          compression-level: 0

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-portal
          path: e2e-results-portal/
          retention-days: 14
