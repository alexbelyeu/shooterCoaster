name: Studio status

# Keeps the "📊 Studio status (live)" issue (label `studio-status`) up to date so
# Alex can see at a glance what the agents are doing: what's being built, what's
# waiting for QA, what shipped, production health and when each role runs next.
# All logic lives in scripts/studio-status.cjs (dry run: node scripts/studio-status.cjs --dry-run).
#
# Changes made with GITHUB_TOKEN (including this workflow's own edit) don't
# trigger workflows, so there is no loop; the schedule catches merges done by
# the auto-merge workflow.

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, labeled, unlabeled, synchronize, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI, Production smoke, Auto-merge approved PRs]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: studio-status
  cancel-in-progress: true

jobs:
  update:
    # Skip comments on the status issue itself and other bot noise.
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.type != 'Bot' && !contains(github.event.issue.labels.*.name, 'studio-status'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/studio-status.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/studio-status.cjs`)
            await run({ github, context, core })
