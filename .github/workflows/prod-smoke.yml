name: Production smoke

# Runs the headless smoke test against the live site after every production
# deployment and nightly. On failure, opens (or comments on) an issue labelled
# agent:prod-broken, which the Maintainer handles first.

on:
  deployment_status:
  schedule:
    - cron: '0 6 * * *' # 02:00 New York (EDT)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    # The smoke grows with every level step (boss, waves, fireworks): it passed in 18 min
    # on 29 Oct and has hit a 20 min cap on every deploy since. Keep ~2x headroom.
    timeout-minutes: 40
    env:
      SITE_URL: https://scoaster.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test production
        # Step cap below the job cap: a slow smoke then fails this step (so `failure()` reports
        # it) and the artifact upload still has time to run.
        timeout-minutes: 32
        run: npm run smoke -- --url "$SITE_URL" --seconds 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-e2e-results
          path: e2e-results/
          retention-days: 14
      - name: Report failure
        # A run that hits timeout-minutes ends `cancelled`, not `failure`: report it too, or
        # production goes unwatched without anyone noticing (no concurrency group here, so
        # nothing else cancels this job).
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'agent:prod-broken',
            })
            const outcome = '${{ job.status }}' === 'cancelled' ? 'timed out or was cancelled' : 'failed'
            const body = `Production smoke test ${outcome} (${context.eventName}, ${context.sha}).\nRun: ${run}\nArtifacts include screenshots and results.json.`
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Production smoke test failing',
                body,
                labels: ['agent:prod-broken', 'P1', 'type:bug'],
              })
            }
