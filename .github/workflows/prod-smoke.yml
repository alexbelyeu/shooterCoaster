name: Production smoke

# Watches the live site (#352). Two suites, each with its own agent:prod-broken issue,
# which the Maintainer handles first:
# - deploy: after every production deployment, e2e/prod-check.mjs asks "did this deploy
#   arrive intact?" (every file of the build served with its headers, routes, title, one
#   level to a kill, a phone run). ~3 min. The full suite already passed in `verify` on the
#   same commit.
# - nightly: the full smoke against the live site, for CDN / runtime drift.
# Each check runs under `timeout`, so a slow run fails with exit 124 and is reported as a
# timeout ("no check failed"), not cancelled. scripts/prod-alert.cjs opens the suite's issue
# only on a green → red transition, stays quiet while it is open, and closes it on the next
# green run (unit tests: prod-alert.test.ts). A run superseded by a newer deploy is cancelled
# by its concurrency group and reports nothing.

on:
  deployment_status:
  schedule:
    - cron: '0 6 * * *' # 02:00 New York (EDT)
  workflow_dispatch:
    inputs:
      suite:
        description: deploy (the post-deploy health check) or nightly (the full smoke)
        type: choice
        options: [deploy, nightly]
        default: deploy
      dry_run:
        description: Run the checks but open or close no issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: >
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'deploy')
    # Job-level, so the deployment_status events that skip this job (pending, other states)
    # never cancel a running check. Back-to-back deploys: only the newest one is checked.
    concurrency:
      group: prod-deploy-${{ github.event.deployment.environment || 'Production' }}
      cancel-in-progress: true
    # Pinned: `playwright install --with-deps` started failing on ubuntu-latest on 2 Nov 2026 (likely its move to Ubuntu 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: https://scoaster.com
      CAP_MINUTES: 8
      # The runner image's Chrome: no Playwright browser download or apt deps on this path.
      SC_CHROME: /usr/bin/google-chrome
    steps:
      # The deployed commit (deployment_status runs check out the deployment's sha).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The file list to expect: the same build Vercel ran (VERCEL=1 includes analytics),
      # matched to the deployed files by name without the hash.
      - run: npx vite build
        env:
          VERCEL: '1'
      - name: Deploy health check
        id: check
        run: |
          set +e
          timeout --kill-after=30s "${CAP_MINUTES}m" node e2e/prod-check.mjs --url "$SITE_URL"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        with:
          name: prod-check-results
          path: e2e-results/
          retention-days: 14
      - name: Report
        if: ${{ !cancelled() && steps.check.outcome == 'success' && !inputs.dry_run }}
        uses: actions/github-script@v7
        env:
          SUITE: deploy
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/prod-alert.cjs`)
            await run({ github, context, core })
      - name: Fail a red check
        if: ${{ steps.check.outputs.exit_code != '0' }}
        run: exit 1

  nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'nightly')
    concurrency:
      group: prod-nightly
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      SITE_URL: https://scoaster.com
      CAP_MINUTES: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test production
        id: check
        run: |
          set +e
          timeout --kill-after=30s "${CAP_MINUTES}m" node e2e/smoke.mjs --mobile --url "$SITE_URL" --seconds 10
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        with:
          name: prod-e2e-results
          path: e2e-results/
          retention-days: 14
      - name: Report
        if: ${{ !cancelled() && steps.check.outcome == 'success' && !inputs.dry_run }}
        uses: actions/github-script@v7
        env:
          SUITE: nightly
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/prod-alert.cjs`)
            await run({ github, context, core })
      - name: Fail a red check
        if: ${{ steps.check.outputs.exit_code != '0' }}
        run: exit 1
