name: Production smoke

# Runs the headless smoke test against the live site after every production
# deployment and nightly. On failure, opens (or comments on) an issue labelled
# agent:prod-broken, which the Maintainer handles first.

on:
  deployment_status:
  schedule:
    - cron: '0 6 * * *' # 02:00 New York (EDT)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://shooter-coaster.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test production
        run: npm run smoke -- --url "$SITE_URL" --seconds 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-e2e-results
          path: e2e-results/
          retention-days: 14
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'agent:prod-broken',
            })
            const body = `Production smoke test failed (${context.eventName}, ${context.sha}).\nRun: ${run}\nArtifacts include screenshots and results.json.`
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Production smoke test failing',
                body,
                labels: ['agent:prod-broken', 'P1', 'type:bug'],
              })
            }
