name: Production smoke

# Watches the live site (#352; e2e/README.md "Production"): after every deploy, the deploy health check
# (e2e/prod-check.mjs, ~3 min); nightly, the full smoke: every step, so also the deep checks the PR shards leave
# out (#372), as four parallel parts (e2e/shards.mjs NIGHTLY_PARTS, #570 and #1046: a run outgrew its 60 min cap; e2e/shards.test.ts
# holds the matrix to the parts and the parts to the full run), plus `slow`, level1 and level3 again under cpu 4x (#539: the
# long-frame trend in its artifact's throttle.json; it and `pacing` fail a shader compiled after the warm-up), that the `nightly` job folds into one verdict. scripts/prod-alert.cjs reports each on its own
# agent:prod-broken issue, on green → red and red → green only. `timeout` turns a slow run into a reported timeout.
# A part that failed while production redeployed under it is inconclusive (exit 3, #822): no alert either way.

on:
  deployment_status:
  schedule:
    - cron: '0 6 * * *' # 02:00 New York (EDT)
  workflow_dispatch:
    inputs:
      suite:
        description: deploy (the post-deploy health check) or nightly (the full smoke)
        type: choice
        options: [deploy, nightly]
        default: deploy
      dry_run:
        description: Run the checks but open or close no issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: >
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'deploy')
    # Job-level, so deployment_status events that skip the job (pending, other states) never cancel a running check.
    concurrency:
      group: prod-deploy-${{ github.event.deployment.environment || 'Production' }}
      cancel-in-progress: true
    # Pinned: Playwright's system dependencies failed to install on ubuntu-latest on 2 Nov 2026 (likely its move to Ubuntu 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: https://scoaster.com
      CAP_MINUTES: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/install-chromium.sh
      # The files to expect: the build Vercel ran (VERCEL=1 includes analytics).
      - run: npx vite build
        env:
          VERCEL: '1'
      - name: Deploy health check
        id: check
        run: |
          set +e
          timeout --kill-after=30s "${CAP_MINUTES}m" node e2e/prod-check.mjs --url "$SITE_URL"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        with:
          name: prod-check-results
          path: e2e-results/
          retention-days: 14
      - name: Report
        if: ${{ !cancelled() && steps.check.outcome == 'success' && !inputs.dry_run }}
        uses: actions/github-script@v7
        env:
          SUITE: deploy
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/prod-alert.cjs`)
            await run({ github, context, core })
      - name: Fail a red check
        if: ${{ steps.check.outputs.exit_code != '0' }}
        run: exit 1

  nightly-part:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'nightly')
    concurrency:
      group: prod-nightly-${{ matrix.part }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        part: [main, rides, deep, pacing, slow]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      SITE_URL: https://scoaster.com
      CAP_MINUTES: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/install-chromium.sh
      - name: Smoke test production (${{ matrix.part }})
        run: |
          set +e
          timeout --kill-after=30s "${CAP_MINUTES}m" node e2e/smoke.mjs --nightly-part "${{ matrix.part }}" --url "$SITE_URL" --seconds 10
          code=$?
          mkdir -p e2e-results
          echo "$code" > e2e-results/exit-code
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: prod-e2e-results-${{ matrix.part }}
          path: e2e-results/
          retention-days: 14

  # The suite's verdict and alert (studio-health.cjs reads this job's conclusion as the nightly's). A part cancelled by
  # a newer nightly (its concurrency group) leaves the verdict to that run.
  nightly:
    needs: nightly-part
    if: ${{ !cancelled() && needs.nightly-part.result != 'cancelled' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'nightly')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CAP_MINUTES: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: prod-e2e-results-*
          path: parts
      - name: Combine the parts
        id: check
        run: node scripts/nightlyParts.cjs parts e2e-results main,rides,deep,pacing,slow >> "$GITHUB_OUTPUT"
      - name: Report
        if: ${{ !cancelled() && steps.check.outcome == 'success' && !inputs.dry_run }}
        uses: actions/github-script@v7
        env:
          SUITE: nightly
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/prod-alert.cjs`)
            await run({ github, context, core })
      # 3: production redeployed mid-run, no single build tested (#822); the Report step warns, the job stays green.
      - name: Fail a red check
        if: ${{ steps.check.outputs.exit_code != '0' && steps.check.outputs.exit_code != '3' }}
        run: exit 1
