name: Deploy

# Production deploys to https://scoaster.com. Vercel doesn't build every merge (vercel.json `git.deploymentEnabled`).
# This workflow has no trigger of its own: the control center's autopilot (alexbelyeu/studio-control, every 3 min) starts
# it once a day after 05:00 UTC and at once while the deploy check is red, and Alex starts it with Deploy now. GitHub runs
# this repo's crons hours late, and CI on main started by auto-merge (GITHUB_TOKEN) starts no workflow_run. Nothing new on
# main, nothing deployed. The logic is scripts/deploy.cjs (deploy.test.ts). Vercel's deployment_status still starts
# prod-smoke.yml's deploy check.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if production already serves main's head
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/deploy.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/deploy.cjs`)
            await run({ github, context, core })
